# android.yml — builds the Android app on GitHub and offers the APK as a
# download (Actions tab -> latest "Android APK" run -> Artifacts).
# Also runs the unit tests and Android lint.  Actions are pinned to commits.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "catalog/**", "icons/**", "brand/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build, test and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-wrench-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
