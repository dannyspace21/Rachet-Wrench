# android.yml — builds, tests and PUBLISHES a complete Ratchet Wrench release.
#
# EVERY release contains EVERYTHING, even when only one part changed:
#   * ratchet-wrench-1.0.N.apk             Android app (signed, self-updating)
#   * RatchetWrench-Windows.zip            desktop app for Windows 10/11
#   * RatchetWrench-macOS-AppleSilicon.zip desktop app for macOS (Apple silicon)
#   * RatchetWrench-Linux.tar.gz           desktop app for Linux
#   * SHA256SUMS.txt                       checksums of all of the above
# One release, one version number ("v1.0.N"), all downloads in one place.
# The Docker server is built from the same commit by whoever runs it
# (docker compose up -d --build).
#
# Steps:
#   1. check  — this version has release notes (android/release_notes.py)
#   2. android + desktop (in parallel)
#        android: unit + screen tests, lint, signed release APK, APK checks,
#                 signature check
#        desktop: build on Windows, macOS and Linux and START each build on its
#                 own system to prove it works (/api/health) before publishing
#   3. publish — only if ALL builds passed: one GitHub Release with every file.
#      If any build fails, nothing is published (a release is never partial).
#
# Why this file is still called android.yml: GitHub numbers runs per workflow
# FILE, and the version (1.0.<run number>) must keep going up for phones to
# accept the update.  A new file would restart at 1.
#
# Security:
#   * Runs only for main (never for pull requests, so secrets are never
#     exposed to proposed changes, including Dependabot's).
#   * Only the publish job may write (to create the release); everything else is read-only.
#   * If the signing secrets are missing it FAILS instead of publishing an
#     APK signed with a throwaway key (which phones couldn't install as an update).
#   * Actions are pinned to exact commits.
name: Release (Android + desktop)

on:
  push:
    branches: [main]
    paths: ["android/**", "server/app/**", "server/requirements.txt", "web/**", "desktop/**", "catalog/**", "icons/**",
            "brand/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Never build two releases at the same time.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RW_VERSION_CODE: ${{ github.run_number }}000
  RW_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check this release has release notes
        # Every release needs an entry in android/app/src/main/assets/release_notes.json
        # (shown in the app after updating, and on the release page).
        run: python3 android/release_notes.py check "$RW_VERSION_NAME"

  android:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      cert: ${{ steps.verify.outputs.cert }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the signing key is configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Follow docs/ANDROID-UPDATES.md (step 1) to create the signing key and add the secrets."
            exit 1
          fi

      - name: Restore the signing key (temporary file, deleted when the job ends)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test, lint and build the signed release APK
        working-directory: android
        env:
          RW_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease

      - name: Check components created by name survived code shrinking
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 android/check_apk.py android/app/build/outputs/apk/release/app-release.apk "$TOOLS"

      - name: Verify the APK is signed with the permanent key
        id: verify
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK" | tee signing.txt
          if grep -qi "CN=Android Debug" signing.txt; then
            echo "::error::APK is signed with a debug key; refusing to publish."; exit 1
          fi
          echo "cert=$(grep -m1 'certificate SHA-256 digest' signing.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp "$APK" "dist/ratchet-wrench-$RW_VERSION_NAME.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: dist/ratchet-wrench-*.apk
          retention-days: 7

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RatchetWrench-Windows.zip
            exe: desktop/dist/RatchetWrench/RatchetWrench.exe
          - os: macos-latest
            artifact: RatchetWrench-macOS-AppleSilicon.zip
            exe: desktop/dist/RatchetWrench.app/Contents/MacOS/RatchetWrench
          - os: ubuntu-latest
            artifact: RatchetWrench-Linux.tar.gz
            exe: desktop/dist/RatchetWrench/RatchetWrench
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # 3.14, not 3.15: on Windows, argon2-cffi-bindings' Python 3.15 wheel
          # needs python3t.dll, which standard Windows Python 3.15 doesn't
          # ship, so the app couldn't start.  3.14 uses the long-established
          # abi3 wheel.  (The Docker server stays on 3.15.)
          python-version: "3.14"
      - name: Install locked, hash-checked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r server/requirements.txt
          python -m pip install --require-hashes -r desktop/requirements-desktop.txt
      - name: Build the app
        run: python desktop/build.py
      - name: Smoke test (start it and check it answers)
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/rwdata" APPDATA="$RUNNER_TEMP/rwdata"
          "${{ matrix.exe }}" --headless --no-browser --port 8099 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8099/api/health; then echo " -> OK"; kill $! 2>/dev/null || true; exit 0; fi
            sleep 2
          done
          echo "::error::The desktop app did not start."
          cat "$RUNNER_TEMP"/rwdata/*/desktop.log 2>/dev/null || true
          exit 1
      - name: Package
        run: |
          cd desktop/dist
          case "${{ matrix.os }}" in
            windows-latest) powershell -NoProfile -Command "Compress-Archive -Path RatchetWrench -DestinationPath ../../${{ matrix.artifact }}" ;;
            macos-latest)   ditto -c -k --keepParent RatchetWrench.app ../../${{ matrix.artifact }} ;;
            *)              tar czf ../../${{ matrix.artifact }} RatchetWrench ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Make sure every download is there
        run: |
          for f in "ratchet-wrench-$RW_VERSION_NAME.apk" RatchetWrench-Windows.zip RatchetWrench-macOS-AppleSilicon.zip RatchetWrench-Linux.tar.gz; do
            [ -s "dist/$f" ] || { echo "::error::Missing $f — refusing to publish a partial release."; exit 1; }
          done
          (cd dist && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CERT: ${{ needs.android.outputs.cert }}
        run: |
          {
            echo "## What's new in $RW_VERSION_NAME"
            echo
            python3 android/release_notes.py markdown "$RW_VERSION_NAME"
          } > notes.md
          cat >> notes.md <<EOF
          ---
          ## Downloads (all built from commit ${GITHUB_SHA::7})

          | Device | File |
          |---|---|
          | Android phone | \`ratchet-wrench-$RW_VERSION_NAME.apk\` — already installed? The app updates itself. |
          | Windows 10/11 | \`RatchetWrench-Windows.zip\` |
          | Mac (Apple silicon) | \`RatchetWrench-macOS-AppleSilicon.zip\` |
          | Linux | \`RatchetWrench-Linux.tar.gz\` |
          | Home server (Docker) | Update with \`git pull\` and \`docker compose up -d --build\` |

          - **Android install / auto-update:** [docs/ANDROID-UPDATES.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/ANDROID-UPDATES.md)
          - **Desktop app (unzip and open RatchetWrench):** [docs/DESKTOP.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/DESKTOP.md)
          - **Android signing certificate SHA-256:** \`$CERT\`
          - **Checksums of every file:** \`SHA256SUMS.txt\`
          EOF
          gh release create "v$RW_VERSION_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ratchet Wrench $RW_VERSION_NAME" --notes-file notes.md --latest
