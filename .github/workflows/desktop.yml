# desktop.yml — builds the Ratchet Wrench DESKTOP app for Windows, macOS and
# Linux and publishes it as a GitHub Release ("desktop-v1.0.<number>").
#
# Each build is started once on its own operating system to prove it works
# (it must answer on /api/health) before anything is published.
# Runs only for main (never for pull requests).  Actions are pinned to commits.
name: Desktop release

on:
  push:
    branches: [main]
    paths: ["server/app/**", "server/requirements.txt", "web/**", "icons/**", "brand/**", "catalog/**", "desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RatchetWrench-Windows.zip
            exe: desktop/dist/RatchetWrench/RatchetWrench.exe
          - os: macos-latest
            artifact: RatchetWrench-macOS-AppleSilicon.zip
            exe: desktop/dist/RatchetWrench.app/Contents/MacOS/RatchetWrench
          - os: ubuntu-latest
            artifact: RatchetWrench-Linux.tar.gz
            exe: desktop/dist/RatchetWrench/RatchetWrench
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # 3.14, not 3.15: on Windows, argon2-cffi-bindings' Python 3.15 wheel
          # needs python3t.dll, which standard Windows Python 3.15 doesn't
          # ship, so the app couldn't start.  3.14 uses the long-established
          # abi3 wheel.  (The Docker server stays on 3.15.)
          python-version: "3.14"
      - name: Install locked, hash-checked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r server/requirements.txt
          python -m pip install --require-hashes -r desktop/requirements-desktop.txt
      - name: Build the app
        run: python desktop/build.py
      - name: Smoke test (start it and check it answers)
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/rwdata" APPDATA="$RUNNER_TEMP/rwdata"
          "${{ matrix.exe }}" --headless --no-browser --port 8099 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8099/api/health; then echo " -> OK"; kill $! 2>/dev/null || true; exit 0; fi
            sleep 2
          done
          echo "::error::The desktop app did not start."
          cat "$RUNNER_TEMP"/rwdata/*/desktop.log 2>/dev/null || true
          exit 1
      - name: Package
        run: |
          cd desktop/dist
          case "${{ matrix.os }}" in
            windows-latest) powershell -NoProfile -Command "Compress-Archive -Path RatchetWrench -DestinationPath ../../${{ matrix.artifact }}" ;;
            macos-latest)   ditto -c -k --keepParent RatchetWrench.app ../../${{ matrix.artifact }} ;;
            *)              tar czf ../../${{ matrix.artifact }} RatchetWrench ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          cd dist && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt
          cat > ../notes.md <<EOF
          Ratchet Wrench **desktop app**, version $VERSION — runs on your computer, no server or Docker needed.

          Download the file for your computer, unzip it, and open **RatchetWrench**.
          See [docs/DESKTOP.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/DESKTOP.md) for step-by-step instructions,
          including the one-time security prompt on Windows and macOS.

          Built automatically from commit ${GITHUB_SHA::7}. Checksums: \`SHA256SUMS.txt\`.
          EOF
          gh release create "desktop-v$VERSION" ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ratchet Wrench Desktop $VERSION" --notes-file ../notes.md --latest=false
