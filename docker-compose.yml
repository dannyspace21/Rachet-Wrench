# docker-compose.yml — runs Ratchet Wrench on your home server.
#
#   docker compose up -d                      # just the app (http://SERVER-IP:8000)
#   docker compose --profile https up -d      # + Caddy for HTTPS (see docs/HTTPS.md)
#   docker compose --profile ntfy up -d       # + your own ntfy push server
#
# Settings and secrets come from the .env file next to this one
# (copy .env.example to .env first).  Never put passwords in this file.

services:
  ratchet-wrench:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ratchet-wrench:latest
    container_name: ratchet-wrench
    restart: unless-stopped
    env_file: .env
    environment:
      RW_DATA_DIR: /data
    volumes:
      - ratchet-data:/data            # database + uploaded files (back this up!)
    ports:
      # Reachable on your home network.  NEVER forward this port on your
      # router; use Tailscale for remote access (see README).
      - "${RW_PORT:-8000}:8000"
    # --- Container hardening ------------------------------------------
    user: "10001:10001"               # not root
    read_only: true                   # code can't be modified at runtime
    tmpfs:
      - /tmp:size=256m,mode=1777      # scratch space for uploads/OCR
    cap_drop: [ALL]                   # no special Linux privileges
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g

  # Optional HTTPS front door.  Edit docs/Caddyfile.example -> ./Caddyfile.
  caddy:
    profiles: ["https"]
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on: [ratchet-wrench]

  # Optional self-hosted ntfy server for push notifications.
  ntfy:
    profiles: ["ntfy"]
    image: binwiederhier/ntfy:v2.38.2@sha256:ca35419d29a834824db2440fa9320897fbe40b026c5fc2360c76ed3501b5e716
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8080}
      NTFY_BEHIND_PROXY: "false"
      NTFY_AUTH_DEFAULT_ACCESS: ${NTFY_AUTH_DEFAULT_ACCESS:-read-write}
    ports:
      - "${NTFY_PORT:-8080}:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    security_opt:
      - no-new-privileges:true

volumes:
  ratchet-data:
  caddy-data:
  caddy-config:
  ntfy-cache:
